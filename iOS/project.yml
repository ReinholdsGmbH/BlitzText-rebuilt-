# BlitzText für iOS: Haupt-App (Diktat-Session, Meetings) und Diktat-Tastatur.
# Entstanden aus dem Machbarkeits-Spike, siehe .planning/phases/999.1-ios-ipados-port.
# Erzeugen: xcodegen generate   (Team-ID gehört in Local.xcconfig, siehe Local.xcconfig.example)
name: BlitzText-iOS
options:
  bundleIdPrefix: de.reinholds
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: de
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: "0.14.3"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  BlitzText:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.reinholds.blitztext.ios
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: BlitzText
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: "BlitzText nimmt Diktate und Meetings auf und transkribiert sie auf dem Gerät."
        CFBundleURLTypes:
          - CFBundleURLName: de.reinholds.blitztext.ios
            CFBundleURLSchemes: [blitztext]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [group.de.reinholds.blitztext]
    dependencies:
      - target: BlitzTextKeyboard
      - package: FluidAudio
        product: FluidAudio
  BlitzTextKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.reinholds.blitztext.ios.keyboard
        CODE_SIGN_ENTITLEMENTS: Keyboard/Keyboard.entitlements
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: BlitzText
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: de-DE
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/Keyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.de.reinholds.blitztext]
