name: BlitzText
options:
  bundleIdPrefix: de.reinholds
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: de
  createIntermediateGroups: true
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.13.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: "0.14.3"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    PRODUCT_BUNDLE_IDENTIFIER: de.reinholds.blitztext
    ENABLE_HARDENED_RUNTIME: YES
    ARCHS: arm64
    EXCLUDED_ARCHS: x86_64
targets:
  BlitzText:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: BlitzText
        excludes:
          - "Info.plist"
          - "BlitzText.entitlements"
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: FluidAudio
        product: FluidAudio
    info:
      path: BlitzText/Info.plist
      properties:
        CFBundleDevelopmentRegion: de
        CFBundleName: BlitzText
        CFBundleDisplayName: BlitzText
        CFBundleShortVersionString: "0.5.6"
        CFBundleVersion: "11"
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSMicrophoneUsageDescription: "BlitzText nimmt deine Stimme auf, um sie in Text umzuwandeln."
        NSSpeechRecognitionUsageDescription: "BlitzText kann lokale Spracherkennung als Fallback nutzen."
        NSAppleEventsUsageDescription: "BlitzText kann Text direkt in andere Apps einfügen."
    entitlements:
      path: BlitzText/BlitzText.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: BlitzText/BlitzText.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_STRICT_CONCURRENCY: minimal
  BlitzTextTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: BlitzTextTests
    dependencies:
      - target: BlitzText
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BlitzText.app/Contents/MacOS/BlitzText"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
schemes:
  BlitzText:
    build:
      targets:
        BlitzText: all
        BlitzTextTests: [test]
    test:
      gatherCoverageData: true
      coverageTargets: [BlitzText]
      targets: [BlitzTextTests]
    run:
      config: Debug
